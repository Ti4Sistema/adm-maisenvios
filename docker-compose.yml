name: adm-maisenvios

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: adm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adm_dev}
      POSTGRES_DB: adm_maisenvios
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adm -d adm_maisenvios']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [app]
    build: ./backend
    environment:
      DATABASE_URL: postgres://adm:${POSTGRES_PASSWORD:-adm_dev}@db:5432/adm_maisenvios
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [app]
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  db-data:
